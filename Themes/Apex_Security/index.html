<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apex Security</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">APEX_SECURITY</div>
    <nav><a href="#services">Services</a><a href="#contact">Contact</a></nav>
  </header>
  <main>
    <section class="hero">
      <h1>Secure Your Digital Frontier</h1>
      <p>High-end application security & penetration testing.</p>
      <button class="btn">Get Protected</button>
    </section>
    <section id="services" class="services">
      <h2>Our Services</h2>
      <div class="grid">
        <div class="card"><h3>Pen Testing</h3><p>Identify vulnerabilities before they do.</p></div>
        <div class="card"><h3>App Security</h3><p>Secure coding practices and audits.</p></div>
        <div class="card"><h3>Threat Intel</h3><p>Real-time monitoring and defense.</p></div>
      </div>
    </section>
    <section id="contact" class="contact">
      <h2>Contact Us</h2>
      <form id="contactForm">
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
        <button type="submit" class="btn">Send</button>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
