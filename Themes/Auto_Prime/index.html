<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Prime | Dealership</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">AUTO PRIME</div>
    <nav><a>Inventory</a><a>Financing</a><a>Service</a></nav>
  </header>
  <main>
    <section class="hero">
      <div class="search-panel">
        <h2>Find Your Next Vehicle</h2>
        <div class="filters">
          <select><option>Make</option><option>BMW</option><option>Audi</option></select>
          <select><option>Model</option></select>
          <select><option>Year</option></select>
          <button class="btn">Search</button>
        </div>
      </div>
    </section>
    <section class="inventory">
      <div class="car-card">
        <div class="img" style="background-image:url('https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&q=80')"></div>
        <div class="info">
          <h3>2023 BMW M4 Competition</h3>
          <p class="specs">3.0L I6 • Automatic • 5,000 mi</p>
          <p class="price">$78,500</p>
        </div>
      </div>
      <div class="car-card">
        <div class="img" style="background-image:url('https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&q=80')"></div>
        <div class="info">
          <h3>2022 Audi RS7</h3>
          <p class="specs">4.0L V8 • Automatic • 12,000 mi</p>
          <p class="price">$95,000</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
