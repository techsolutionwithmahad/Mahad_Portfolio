<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Canvas | Developer Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal">
        <div class="terminal-header">
            <div class="buttons">
                <span class="close"></span>
                <span class="minimize"></span>
                <span class="maximize"></span>
            </div>
            <div class="title">guest@code-canvas: ~</div>
        </div>
        <div class="terminal-body" id="terminal-output">
            <div class="line"><span class="prompt">guest@code-canvas:~$</span> ./init_portfolio.sh</div>
            <div class="line success">Initializing system... [OK]</div>
            <div class="line">Loading profile...</div>
        </div>
        <div class="input-line">
            <span class="prompt">guest@code-canvas:~$</span>
            <input type="text" id="terminal-input" autofocus autocomplete="off">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
