<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Splash | Graphic Design</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor-blob"></div>
    <header>
        <div class="logo">CS</div>
        <nav>
            <a href="#">Work</a>
            <a href="#">Studio</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>We Design <br><span class="gradient-text">Experiences</span></h1>
            <p>A highly interactive, colorful portfolio showcasing branding and visual design.</p>
        </section>

        <section class="portfolio">
            <div class="project-card" style="--card-color: #FF3366;">
                <div class="card-content">
                    <h2>Brand Identity</h2>
                    <p>Neon Vibes Co.</p>
                </div>
                <div class="card-bg"></div>
            </div>
            <div class="project-card" style="--card-color: #33CCFF;">
                <div class="card-content">
                    <h2>UI/UX Design</h2>
                    <p>Water App</p>
                </div>
                <div class="card-bg"></div>
            </div>
            <div class="project-card" style="--card-color: #FFCC00;">
                <div class="card-content">
                    <h2>Typography</h2>
                    <p>Sunny Days Font</p>
                </div>
                <div class="card-bg"></div>
            </div>
            <div class="project-card" style="--card-color: #9933FF;">
                <div class="card-content">
                    <h2>Illustration</h2>
                    <p>Cosmic Journey</p>
                </div>
                <div class="card-bg"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
