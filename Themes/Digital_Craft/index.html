<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Craft</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">DigitalCraft.</div>
    <nav><a>UI Kits</a><a>Templates</a><a>Fonts</a></nav>
    <button class="btn-login">Sign In</button>
  </header>
  <main>
    <section class="hero">
      <h1>Premium Assets for Creators.</h1>
      <p>Elevate your design workflow with top-tier digital resources.</p>
      <div class="search-bar">
        <input type="text" placeholder="Search assets...">
        <button>Search</button>
      </div>
    </section>
    <section class="grid">
      <div class="card">
        <div class="img">🎨</div>
        <div class="details">
          <h3>Nova UI Design System</h3>
          <p>$49</p>
        </div>
      </div>
      <div class="card">
        <div class="img">📝</div>
        <div class="details">
          <h3>Aura Framer Template</h3>
          <p>$29</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
