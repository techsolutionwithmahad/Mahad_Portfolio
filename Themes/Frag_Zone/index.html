<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frag Zone | Esports</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">FRAG_ZONE</div>
        <nav>
            <a href="#">Roster</a>
            <a href="#">Matches</a>
            <a href="#">News</a>
            <a href="#">Shop</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="DOMINATE">DOMINATE</h1>
            </div>
            <p>The premier competitive gaming organization.</p>
        </section>

        <section class="matches">
            <h2>Upcoming Matches</h2>
            <div class="match-list">
                <div class="match-item">
                    <div class="team">FZ.Alpha</div>
                    <div class="vs">VS</div>
                    <div class="team enemy">Team Liquid</div>
                    <div class="date">Tomorrow, 18:00 EST</div>
                </div>
                <div class="match-item">
                    <div class="team">FZ.Beta</div>
                    <div class="vs">VS</div>
                    <div class="team enemy">Cloud9</div>
                    <div class="date">Oct 15, 20:00 EST</div>
                </div>
            </div>
        </section>

        <section class="roster">
            <h2>Active Roster</h2>
            <div class="player-grid">
                <div class="player-card">
                    <div class="card-inner">
                        <div class="card-front" style="background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop');">
                            <h3 class="ign">Shadow</h3>
                        </div>
                        <div class="card-back">
                            <h3>Shadow</h3>
                            <p>Role: Entry Fragger</p>
                            <p>K/D: 1.45</p>
                        </div>
                    </div>
                </div>
                <div class="player-card">
                    <div class="card-inner">
                        <div class="card-front" style="background-image: url('https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500&auto=format&fit=crop');">
                            <h3 class="ign">Viper</h3>
                        </div>
                        <div class="card-back">
                            <h3>Viper</h3>
                            <p>Role: Support / IGL</p>
                            <p>K/D: 1.10</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
