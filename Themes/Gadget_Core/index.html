<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gadget Core | Electronics</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">GADGET_CORE</div>
    <div class="search"><input type="text" placeholder="Search components..."><button>Go</button></div>
    <nav><a>Components</a><a>Peripherals</a><a>Cart (0)</a></nav>
  </header>
  <main>
    <section class="banner">
      <h1>Next-Gen Performance</h1>
      <p>Upgrade your battlestation with our latest GPU restocks.</p>
      <button class="btn">Shop Hardware</button>
    </section>
    <section class="store">
      <div class="product-card">
        <div class="img">🔋</div>
        <div class="info">
          <h3>Quantum Core CPU</h3>
          <p class="price">$499.99</p>
          <button class="btn-sm">Add to Cart</button>
        </div>
      </div>
      <div class="product-card">
        <div class="img">⌨️</div>
        <div class="info">
          <h3>Mech Keyboard v2</h3>
          <p class="price">$129.99</p>
          <button class="btn-sm">Add to Cart</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
