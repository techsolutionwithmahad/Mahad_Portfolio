<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Trot | Travel Agency</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">GLOBE TROT</div>
        <nav>
            <a href="#">Destinations</a>
            <a href="#">Tours</a>
            <a href="#">Gallery</a>
        </nav>
        <button class="book-btn">Book Now</button>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Discover the World<br>With Us.</h1>
                <div class="search-box">
                    <input type="text" placeholder="Where do you want to go?">
                    <input type="date">
                    <button>Search</button>
                </div>
            </div>
        </section>

        <section class="packages">
            <h2>Popular Packages</h2>
            <div class="cards-wrapper">
                <div class="package-card">
                    <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?w=500&auto=format&fit=crop" alt="Paris">
                    <div class="card-content">
                        <h3>Romantic Paris</h3>
                        <p>5 Days, 4 Nights</p>
                        <div class="price">$1,299</div>
                    </div>
                </div>
                <div class="package-card">
                    <img src="https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=500&auto=format&fit=crop" alt="Maldives">
                    <div class="card-content">
                        <h3>Maldives Escape</h3>
                        <p>7 Days, 6 Nights</p>
                        <div class="price">$2,499</div>
                    </div>
                </div>
                <div class="package-card">
                    <img src="https://images.unsplash.com/photo-1480796927426-f609979314bd?w=500&auto=format&fit=crop" alt="Japan">
                    <div class="card-content">
                        <h3>Tokyo Adventure</h3>
                        <p>10 Days, 9 Nights</p>
                        <div class="price">$1,899</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
