<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest Fresh</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🌿 HarvestFresh</div>
    <nav><a>Produce</a><a>Dairy</a><a>Bakery</a></nav>
    <div class="cart">🛒 Cart</div>
  </header>
  <main>
    <section class="hero">
      <h1>Farm to Table, Every Day.</h1>
      <p>100% organic, locally sourced groceries delivered to your door.</p>
    </section>
    <section class="grid-layout">
      <h2>Fresh Picks</h2>
      <div class="grid">
        <div class="item">
          <div class="emoji">🍎</div>
          <h3>Organic Apples</h3>
          <p>$4.99 / lb</p>
          <button>+</button>
        </div>
        <div class="item">
          <div class="emoji">🥕</div>
          <h3>Farm Carrots</h3>
          <p>$2.49 / bunch</p>
          <button>+</button>
        </div>
        <div class="item">
          <div class="emoji">🥑</div>
          <h3>Avocados</h3>
          <p>$1.99 / ea</p>
          <button>+</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
