<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Give | Charity</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">HeartGive</div>
        <nav>
            <a href="#">Our Mission</a>
            <a href="#">Campaigns</a>
            <a href="#">Volunteer</a>
        </nav>
        <button class="donate-btn-header">Donate Now</button>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Small Acts.<br>Big Impact.</h1>
                <p>Join us in providing clean water, education, and healthcare to communities in need around the globe.</p>
                <div class="hero-actions">
                    <button class="btn-primary">Donate Today</button>
                    <button class="btn-outline">Become a Volunteer</button>
                </div>
            </div>
            <div class="hero-img">
                <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=800&auto=format&fit=crop" alt="Helping Hands">
            </div>
        </section>

        <section class="campaigns">
            <h2>Active Campaigns</h2>
            <div class="campaign-grid">
                <div class="campaign-card">
                    <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=500&auto=format&fit=crop" alt="Water">
                    <div class="card-content">
                        <h3>Clean Water Initiative</h3>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 75%;" data-width="75%"></div>
                        </div>
                        <div class="stats">
                            <span>Raised: $75,000</span>
                            <span>Goal: $100,000</span>
                        </div>
                        <button class="donate-btn">Donate</button>
                    </div>
                </div>
                <div class="campaign-card">
                    <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=500&auto=format&fit=crop" alt="Education">
                    <div class="card-content">
                        <h3>Education for All</h3>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 40%;" data-width="40%"></div>
                        </div>
                        <div class="stats">
                            <span>Raised: $20,000</span>
                            <span>Goal: $50,000</span>
                        </div>
                        <button class="donate-btn">Donate</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
