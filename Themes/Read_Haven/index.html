<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Read Haven</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Read Haven</div>
    <div class="search">Search titles, authors...</div>
    <nav><a>Fiction</a><a>Non-Fiction</a><a>Cart</a></nav>
  </header>
  <main>
    <section class="featured">
      <div class="book-cover">📖</div>
      <div class="book-info">
        <h2>The Silent Echo</h2>
        <p class="author">by Clara V. Hughes</p>
        <p class="desc">A masterful exploration of memory and identity in a world that forgets.</p>
        <button class="btn">Add to Cart - $18.99</button>
      </div>
    </section>
    <section class="shelf">
      <h3>Bestsellers</h3>
      <div class="books">
        <div class="book">📘<p>Winter's Tale</p></div>
        <div class="book">📕<p>Crimson</p></div>
        <div class="book">📗<p>Nature's Path</p></div>
        <div class="book">📙<p>Solar Flare</p></div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
