<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight Talent | Actor Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">ALEXA VANCE</div>
        <nav>
            <a href="#about">About</a>
            <a href="#headshots">Headshots</a>
            <a href="#showreel">Showreel</a>
            <a href="#resume">Resume</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-bg"></div>
            <div class="hero-content">
                <h1>Actor. Model.<br>Creator.</h1>
                <p>Represented by Global Talent Agency.</p>
                <a href="#contact" class="btn">Book Me</a>
            </div>
        </section>

        <section id="headshots" class="headshots">
            <h2>Gallery</h2>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop" alt="Headshot 1"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600&auto=format&fit=crop" alt="Headshot 2"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&auto=format&fit=crop" alt="Headshot 3"></div>
                <div class="gallery-item"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&auto=format&fit=crop" alt="Headshot 4"></div>
            </div>
        </section>

        <section id="showreel" class="showreel">
            <h2>Showreel</h2>
            <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
