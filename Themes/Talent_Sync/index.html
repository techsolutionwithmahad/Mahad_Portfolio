<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Sync | HR & Recruiting</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">TalentSync</div>
    <div class="search-bar"><input type="text" placeholder="Search jobs, skills..."></div>
    <button class="btn">Post a Job</button>
  </header>
  <main>
    <section class="hero">
      <h1>Find Your Next Great Hire</h1>
      <p>Connecting top talent with innovative companies worldwide.</p>
    </section>
    <section class="job-board">
      <div class="filters">
        <h3>Filters</h3>
        <label><input type="checkbox"> Remote</label>
        <label><input type="checkbox"> Full-time</label>
        <label><input type="checkbox"> Contract</label>
      </div>
      <div class="job-list">
        <div class="job-card">
          <div class="job-info">
            <h4>Senior Frontend Engineer</h4>
            <p>TechCorp Inc. • Remote</p>
          </div>
          <button class="btn-outline">Apply</button>
        </div>
        <div class="job-card">
          <div class="job-info">
            <h4>Product Designer</h4>
            <p>Creative Studio • New York, NY</p>
          </div>
          <button class="btn-outline">Apply</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
