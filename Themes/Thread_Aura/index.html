<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thread Aura | Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">Thread Aura</div>
    <nav><a href="#">New Arrivals</a><a href="#">Dresses</a><a href="#">Accessories</a></nav>
    <div class="cart">Cart (0)</div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>Elegance Redefined</h1>
        <a href="#" class="btn">Shop Collection</a>
      </div>
    </section>
    <section class="products">
      <h2>Trending Now</h2>
      <div class="grid">
        <div class="product">
          <div class="img" style="background-image:url('https://images.unsplash.com/photo-1515347619362-75fcda09e355?auto=format&fit=crop&q=80')"></div>
          <h3>Silk Wrap Dress</h3>
          <p>$145.00</p>
        </div>
        <div class="product">
          <div class="img" style="background-image:url('https://images.unsplash.com/photo-1495385794356-15371f348c31?auto=format&fit=crop&q=80')"></div>
          <h3>Minimalist Tote</h3>
          <p>$89.00</p>
        </div>
        <div class="product">
          <div class="img" style="background-image:url('https://images.unsplash.com/photo-1550639525-c97d455acf70?auto=format&fit=crop&q=80')"></div>
          <h3>Linen Blazer</h3>
          <p>$210.00</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
