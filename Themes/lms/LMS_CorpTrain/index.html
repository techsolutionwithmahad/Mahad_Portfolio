<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorpTrain Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">CorpTrain Solutions</div>
        <ul class="nav-links">
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Training Modules</a></li>
            <li><a href="#">Certifications</a></li>
            <li><a href="#">Profile</a></li>
        </ul>
    </nav>
    <main class="dashboard">
        <header class="welcome-section">
            <h1>Welcome back, Associate.</h1>
            <p>You have 2 compliance modules pending completion.</p>
        </header>
        <section class="course-grid">
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Workplace Safety Q3</h3>
                    <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
                    <button class="continue-btn">Resume Module</button>
                </div>
            </div>
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Data Privacy Basics</h3>
                    <div class="progress-bar"><div class="progress" style="width: 30%"></div></div>
                    <button class="continue-btn">Resume Module</button>
                </div>
            </div>
             <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Leadership Fundamentals</h3>
                    <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
                    <button class="continue-btn">Start Module</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
