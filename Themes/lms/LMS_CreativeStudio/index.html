<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreativeStudio Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">StudioHub</div>
        <ul class="nav-links">
            <li><a href="#">Workspaces</a></li>
            <li><a href="#">Inspiration</a></li>
            <li><a href="#">Portfolio</a></li>
        </ul>
    </nav>
    <main class="dashboard">
        <header class="welcome-section">
            <h1>Hello, Creator! ✨</h1>
            <p>Let's make something beautiful today.</p>
        </header>
        <section class="course-grid">
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Digital Illustration</h3>
                    <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
                    <button class="continue-btn">Keep Creating</button>
                </div>
            </div>
            <div class="course-card">
                <div class="course-image" style="background: var(--secondary)"></div>
                <div class="course-info">
                    <h3>Typography Masterclass</h3>
                    <div class="progress-bar"><div class="progress" style="width: 30%"></div></div>
                    <button class="continue-btn">Keep Creating</button>
                </div>
            </div>
             <div class="course-card">
                <div class="course-image" style="background: #FFDAB9"></div>
                <div class="course-info">
                    <h3>UI/UX Foundations</h3>
                    <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
                    <button class="continue-btn">Start Project</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
