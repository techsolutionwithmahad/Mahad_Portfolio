<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Discover!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">KidsDiscover!</div>
        <ul class="nav-links">
            <li><a href="#">Home Base</a></li>
            <li><a href="#">New Games</a></li>
            <li><a href="#">My Badges</a></li>
        </ul>
    </nav>
    <main class="dashboard">
        <header class="welcome-section">
            <h1>Hi there, Super Learner! 🌟</h1>
            <p>Ready for today's big adventure?</p>
        </header>
        <section class="course-grid">
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Dino World</h3>
                    <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
                    <button class="continue-btn">Play Now!</button>
                </div>
            </div>
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Space Mission</h3>
                    <div class="progress-bar"><div class="progress" style="width: 30%"></div></div>
                    <button class="continue-btn">Play Now!</button>
                </div>
            </div>
             <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Art Studio</h3>
                    <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
                    <button class="continue-btn">Let's Go!</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
