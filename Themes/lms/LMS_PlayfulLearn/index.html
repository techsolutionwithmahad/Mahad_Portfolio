<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS PlayfulLearn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">PlayfulLearn</div>
        <ul class="nav-links">
            <li><a href="#">My Journey</a></li>
            <li><a href="#">Explore</a></li>
            <li><a href="#">Backpack</a></li>
        </ul>
    </nav>
    <main class="dashboard">
        <header class="welcome-section">
            <h1>Welcome back, Explorer! 🚀</h1>
            <p>You have 2 adventures in progress.</p>
        </header>
        <section class="course-grid">
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Color Theory Quest</h3>
                    <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
                    <button class="continue-btn">Keep Playing</button>
                </div>
            </div>
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Magic of Numbers</h3>
                    <div class="progress-bar"><div class="progress" style="width: 30%"></div></div>
                    <button class="continue-btn">Keep Playing</button>
                </div>
            </div>
             <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Dinosaur Discovery</h3>
                    <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
                    <button class="continue-btn">Start Adventure</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
