<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenMind Wellness</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">ZenMind</div>
        <ul class="nav-links">
            <li><a href="#">Sanctuary</a></li>
            <li><a href="#">Practices</a></li>
            <li><a href="#">Journal</a></li>
        </ul>
    </nav>
    <main class="dashboard">
        <header class="welcome-section">
            <h1>Breathe, Relax, Learn.</h1>
            <p>Your peaceful journey continues here.</p>
        </header>
        <section class="course-grid">
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Mindful Meditation</h3>
                    <div class="progress-bar"><div class="progress" style="width: 60%"></div></div>
                    <button class="continue-btn">Resume Practice</button>
                </div>
            </div>
            <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Yoga Foundations</h3>
                    <div class="progress-bar"><div class="progress" style="width: 30%"></div></div>
                    <button class="continue-btn">Resume Practice</button>
                </div>
            </div>
             <div class="course-card">
                <div class="course-image"></div>
                <div class="course-info">
                    <h3>Art of Tea</h3>
                    <div class="progress-bar"><div class="progress" style="width: 0%"></div></div>
                    <button class="continue-btn">Begin Journey</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
